<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beatrider</title>

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thebeatrider.com/play/">
  <meta property="og:title" content="BEATRIDER - Play Now">
  <meta property="og:description" content="Arrow keys or WASD to move. Swipe on mobile. A retro rhythm shooter that adapts to your skill.">
  <meta property="og:image" content="https://thebeatrider.com/play/og-image-game.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BEATRIDER - Play Now">
  <meta name="twitter:description" content="Arrow keys or WASD to move. Swipe on mobile. A retro rhythm shooter that adapts to your skill.">
  <meta name="twitter:image" content="https://thebeatrider.com/play/og-image-game.png">

  <!-- Favicon - simple pixelated B in cyan -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%2300ffcc' font-family='monospace' font-size='24' font-weight='bold'>B</text></svg>">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A retro lane-based rhythm shooter game">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Beatrider">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Analytics (disabled in deterministic test mode) -->
  <script>
    window.__BEATRIDER_TEST_MODE__ = new URLSearchParams(window.location.search).get('testMode') === '1';
    if (!window.__BEATRIDER_TEST_MODE__) {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', 'G-6SQJ9NR8SD', { send_page_view: true });

      const analyticsScript = document.createElement('script');
      analyticsScript.async = true;
      analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-6SQJ9NR8SD';
      document.head.appendChild(analyticsScript);
    }
  </script>

  <link rel="stylesheet" href="./styles/game.css">
</head>
<body>
  <div class="container">
    <div id="gameContainer"></div>

    <!-- In-game buttons; shown only while a run is on screen -->
    <div id="hud" class="hud" hidden>
      <button id="pauseBtn" class="hud-btn" type="button" aria-label="Pause" title="Pause (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
      </button>
      <button id="settingsBtn" class="hud-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>

    <!-- Pause menu -->
    <div id="pauseMenu" class="menu-screen" hidden>
      <div class="menu-card pause-card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
        <h2 id="pauseTitle" class="menu-title">PAUSED</h2>
        <div class="pause-scores">
          <div><span class="score-label">SCORE</span><span id="pauseScore" class="score-value">0</span></div>
          <div><span class="score-label">HIGH</span><span id="pauseHighScore" class="score-value high">0</span></div>
        </div>
        <div class="menu-actions">
          <button class="menu-btn primary" type="button" data-action="resume">RESUME</button>
          <button class="menu-btn" type="button" data-action="settings">SETTINGS</button>
          <button class="menu-btn" type="button" data-action="restart">RESTART</button>
          <button class="menu-btn" type="button" data-action="quit">QUIT TO TITLE</button>
        </div>
        <p class="menu-hint desktop-only">ESC or SPACE to resume</p>
        <div class="menu-footer">
          <button class="link-btn" type="button" data-action="feedback">Send feedback</button>
          <a class="link-btn" href="../" target="_blank" rel="noopener">About</a>
        </div>
      </div>
    </div>

    <!-- Settings -->
    <div id="settingsMenu" class="menu-screen" hidden>
      <div class="menu-card settings-card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <h2 id="settingsTitle" class="menu-title">SETTINGS</h2>
          <button class="close-btn" type="button" data-action="close-settings" aria-label="Close settings">&#x2715;</button>
        </header>

        <div class="settings-tabs" role="tablist">
          <button class="tab" type="button" role="tab" id="tabGame" data-tab="game" aria-selected="true" aria-controls="panelGame">GAME</button>
          <button class="tab" type="button" role="tab" id="tabMusic" data-tab="music" aria-selected="false" aria-controls="panelMusic">MUSIC</button>
        </div>

        <div class="settings-body">
          <section class="settings-panel" id="panelGame" data-panel="game" role="tabpanel" aria-labelledby="tabGame">
            <div class="field">
              <label for="difficultySelector">Difficulty</label>
              <select id="difficultySelector">
                <option value="zen">Zen</option>
                <option value="normal" selected>Normal</option>
                <option value="intense">Intense</option>
                <option value="chaos">Chaos</option>
              </select>
              <span id="difficultyDisplay" class="field-hint">Standard</span>
            </div>
            <div class="field">
              <label for="characterSelector">Rider</label>
              <select id="characterSelector">
                <option value="unicorn">Unicorn</option>
                <option value="classic">Classic</option>
              </select>
            </div>
            <div class="field">
              <label for="soundSelector">Shot sound</label>
              <select id="soundSelector">
                <option value="0">Triangle</option>
                <option value="1">Acid</option>
                <option value="2">Chord</option>
                <option value="3">Echo</option>
                <option value="4">Pluck</option>
                <option value="5">Pew Pew</option>
              </select>
            </div>
            <div class="field">
              <label for="gridToggle">Grid</label>
              <input type="checkbox" id="gridToggle" class="switch" role="switch">
            </div>
          </section>

          <section class="settings-panel" id="panelMusic" data-panel="music" role="tabpanel" aria-labelledby="tabMusic" hidden>
            <div class="field stacked">
              <span class="field-label">Genre</span>
              <div class="segmented" role="group" aria-label="Genre">
                <button id="genreTechno" type="button" class="segment">Techno</button>
                <button id="genreDnb" type="button" class="segment">D&amp;B</button>
                <button id="genreTropical" type="button" class="segment">Tropical</button>
                <button id="genreDubstep" type="button" class="segment">Dubstep</button>
                <button id="genreTrance" type="button" class="segment">Trance</button>
              </div>
            </div>
            <div class="field">
              <label for="musicPresetSelector">Mood</label>
              <select id="musicPresetSelector">
                <option value="">Custom</option>
                <option value="chill">Chill</option>
                <option value="driving" selected>Driving</option>
                <option value="peak">Peak Time</option>
                <option value="acid">Acid Storm</option>
                <option value="dark">Dark</option>
                <option value="hypnotic">Hypnotic</option>
                <option value="anthem">Anthem</option>
              </select>
              <span id="musicPresetDisplay" class="field-hint">Classic driving</span>
            </div>
            <div class="field stacked">
              <span class="field-label">Tracks <span class="field-hint inline">tap to mute</span></span>
              <div class="track-squares">
                <button type="button" class="track-square" id="kickSquare" data-track="kick">Kick</button>
                <button type="button" class="track-square" id="snareSquare" data-track="snare">Snare</button>
                <button type="button" class="track-square" id="hatSquare" data-track="hat">Hat</button>
                <button type="button" class="track-square" id="acidSquare" data-track="acid">Acid</button>
                <button type="button" class="track-square" id="stabSquare" data-track="stab">Stab</button>
                <button type="button" class="track-square" id="subSquare" data-track="sub">Sub</button>
              </div>
            </div>
            <details class="advanced">
              <summary>Advanced</summary>
              <div class="field">
                <label for="bpmSlider">BPM</label>
                <input type="range" id="bpmSlider" min="120" max="150" value="132">
                <span id="bpmDisplay" class="field-value">132</span>
              </div>
              <div class="field">
                <label for="energySlider">Energy</label>
                <input type="range" id="energySlider" min="0" max="100" value="50">
                <span id="energyDisplay" class="field-value">50</span>
              </div>
              <div class="field">
                <label for="tensionSlider">Tension</label>
                <input type="range" id="tensionSlider" min="0" max="100" value="30">
                <span id="tensionDisplay" class="field-value">30</span>
              </div>
            </details>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
